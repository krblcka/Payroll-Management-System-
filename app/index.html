<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="auth-screen">
    <div class="auth-card">
      <div class="logo-mark">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
          </svg>
        </div>
        <div>
          <div class="logo-text">KazHR Portal</div>
          <div class="logo-sub">Payroll &amp; HR Management</div>
        </div>
      </div>
      <div class="auth-title">Welcome back</div>
      <div class="auth-sub">Sign in to your account to continue</div>
      <div class="role-tabs">
        <button class="role-tab active" onclick="setRole('employer')">Employer</button>
        <button class="role-tab" onclick="setRole('employee')">Employee</button>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" id="login-email" placeholder="your@company.kz" value="admin@techkz.kz">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" type="password" id="login-pass" placeholder="••••••••" value="demo1234">
      </div>
      <button class="btn-primary" onclick="login()">Sign in</button>
      <div class="demo-hint">Demo: switch roles above and click Sign in</div>
    </div>
  </div>

  <!-- APP -->
  <div id="app">
    <div class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-text">KazHR Portal</div>
        <div class="logo-sub">Payroll &amp; HR</div>
      </div>
      <div class="sidebar-user">
        <div class="sidebar-user-name" id="sb-name">—</div>
        <div class="sidebar-user-role" id="sb-role">—</div>
      </div>
      <div class="sidebar-nav" id="sidebar-nav"></div>
      <div class="sidebar-footer">
        <button class="logout-btn" onclick="logout()">Sign out</button>
      </div>
    </div>
    <div class="main-content" id="main-content"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
